# The loader row dsh-clinepass needs in a profile's cordis.patch.yml.
#
# Since 0.8.0 the Cline Pass *provider card* is a second patch row that ships
# with the package (`cordis.patch.yml`) and is appended by install.mjs — see the
# README section 「卡片怎么来的：随包声明」. It is declared rather than written at
# run time because on dsh 0.1.7 that write is not dependable (the settings
# service is not up at a cold start, and on a fresh profile the write waits on
# the profile manifest's writer lock). If you declare `- id: llm-pi-ai` yourself,
# copy the `cline-pass:` block from the README into your row — a patch row
# replaces that row's whole config, so it would otherwise drop this provider.
#
# `upstream` and `pin` have working defaults (https://api.cline.bot,
# ["deepseek"]), so mounting this row is enough. install.mjs appends it for you.
- insert:
    - id: clinepass
      name: './plugins/dsh-clinepass/index.js'
      config:
        # Real gateway origin. The profile is pointed straight at it: the pin is
        # injected in-process by wrapping `globalThis.fetch`, so this plugin
        # opens no listener and no port.
        upstream: https://api.cline.bot
        # Upstream channels every pinned request is restricted to.
        pin:
          - deepseek
        # Optional: per-model pins, e.g.
        # pins:
        #   cline-pass/deepseek-v4.1-flash:
        #     - deepseek
        # Optional: where the running plugin reports its state
        # (`hook`/`seen`/`pinned`/`lastPin`). Defaults to
        # <DSH_HOME>/dsh-clinepass-status.json; `false` turns it off.
        # statusFile: /tmp/dsh-clinepass-status.json
        # Optional: `false` to skip provisioning the provider card, and
        # `false` to skip migrating a stored reasoning effort.
        # provision: true
        # alignReasoningEffort: true
